name: Deploy to Cloudflare

# On every push to main: run the worker test suite (the CI gate), apply the
# Neon migration, then deploy the Worker + static assets with Wrangler.
# Cloudflare (already routing shibka.kyleholzinger.dev once the domain cutover
# in DEPLOY.md is done) serves the result directly -- no SSH, no box.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  - scoped to this account with "Workers Scripts:Edit"
#                           permission (dashboard -> My Profile -> API Tokens).
#   CLOUDFLARE_ACCOUNT_ID - the Cloudflare account ID that owns the Worker.
#   DATABASE_URL          - Neon pooled connection string, used by
#                           `npm run migrate` right before the deploy step.
#
# The old EC2_HOST / EC2_USER / EC2_SSH_KEY / EC2_PORT secrets are obsolete now
# that Shibka runs on Cloudflare Workers instead of the EC2 box -- see the
# decommission checklist in DEPLOY.md before deleting them.

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual "Run workflow" from the Actions tab

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Apply database migration
        run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
